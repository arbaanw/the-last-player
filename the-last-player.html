<script>
'use strict';
const W=960,H=540,DT=1/60,C=document.getElementById('c'),X=C.getContext('2d');C.width=W;C.height=H;
const ls={g:k=>{try{return localStorage.getItem(k)}catch(e){return null}},s:(k,v)=>{try{localStorage.setItem(k,v)}catch(e){}}};
let muted=ls.g('tlp_m')==='1',AC,M;
const K={},P={};
addEventListener('keydown',e=>{if(!e.repeat)P[e.code]=1;K[e.code]=1;if(/^(Space|Arrow)/.test(e.code))e.preventDefault();audioInit()});
addEventListener('keyup',e=>{K[e.code]=0});
addEventListener('blur',()=>{for(const k in K)K[k]=0;pause()});
document.addEventListener('visibilitychange',()=>{if(document.hidden)pause()});
function pause(){if(S==='play')S='pause'}
function audioInit(){if(AC){if(AC.state==='suspended')AC.resume();return}
 try{AC=new(window.AudioContext||window.webkitAudioContext)();M=AC.createGain();M.gain.value=muted?0:1;M.connect(AC.destination);
 [55,82.4,110.3].forEach(f=>{const o=AC.createOscillator(),g=AC.createGain();o.frequency.value=f;g.gain.value=.022;o.connect(g);g.connect(M);o.start()})}catch(e){AC=null}}
function snd(f,d,ty,v,s){if(!AC||muted)return;try{const n=AC.currentTime,o=AC.createOscillator(),g=AC.createGain();o.type=ty||'sine';o.frequency.setValueAtTime(f,n);if(s)o.frequency.exponentialRampToValueAtTime(Math.max(20,f+s),n+d);g.gain.setValueAtTime(v||.06,n);g.gain.exponentialRampToValueAtTime(.001,n+d);o.connect(g);g.connect(M);o.start(n);o.stop(n+d)}catch(e){}}

const LV=[[

{n:'THE ARCHIVE',cap:2,s:[60,446],x:[914,436],obj:'Cross the archive',hint:'Two recordings. Two plates. One bridge. Plan the order.',

 d:[{x:420,y:480,w:360,h:14,ids:['A','B'],b:1},{x:880,y:0,w:16,h:480,ids:['C']}],

 mv:[{x:720,y:390,w:80,ay:90,s:1.2}],lz:[{x:650,y:410,w:14,h:70,ax:30,s:2.2}]}

const END=[[['The archive was never storing the experiment.','It was storing you.']],[['Every run was authorized by one name.','Signed: you.'],'#ffb347'],[['The final door opens.','Behind you, two recordings stay where you left them,','still holding it.']]];

/* ---------- state ---------- */
let S='title',lvl=0,ri=0,R,t=0,pl,rec=[],echoes=[],act={},shake=0,flash=0,toastT=0,toastS='',fd=0,fi=0,fcb,card,T=0,age=0;
const dust=Array.from({length:50},()=>({x:Math.random()*W,y:Math.random()*H,v:.2+Math.random()*.4}));
function ov(a,b){return a.x<b[0]+b[2]&&a.x+a.w>b[0]&&a.y<b[1]+b[3]&&a.y+a.h>b[1]}
function at(m,tt){const s=Math.sin(tt/60*m.s+(m.ph||0));return[m.x+(m.ax||0)*s,m.y+(m.ay||0)*s,m.w,m.h||12]}
function mv(u,dx,dy,so){u.x+=dx;for(const s of so)if(ov(u,s)&&dx){u.x=dx>0?s[0]-u.w:s[0]+s[2];u.vx=0}
 u.y+=dy;u.g=0;for(const s of so)if(ov(u,s)){if(dy>0){u.y=s[1]-u.h;u.g=1}else if(dy<0)u.y=s[1]+s[3];u.vy=0}}
function sol(tt){const a=R.p.slice();R.mv.forEach(m=>a.push(at(m,tt)));R.d.forEach(d=>{if(d.b?d.o:!d.o)a.push([d.x,d.y,d.w,d.h])});return a}
function toast(s){toastS=s;toastT=7;snd(700,.15,'sine',.04)}
function seq(list,cb){let i=0;const n=()=>{if(i>=list.length)return cb();const c=list[i++];S='card';card={L:c[0],c:c[1]||'#cfe8ff',t:0,cb:n}};n()}
function go(cb){S='fade';fd=0;fcb=cb}
function loadRoom(l,r){lvl=l;ri=r;R=LV[l][r];for(const k of['p','pl','d','sw','sp','mv','lz'])R[k]=R[k]||[];echoes=[];age=0;toastT=0;reset()}
function startLevel(l){ls.s('tlp',String(l));loadRoom(l,0);S='play';fi=.5}
function startGame(l){seq(LC[l],()=>startLevel(l))}
function endLevel(){if(lvl<2){lvl===1?seq(REV,()=>startGame(2)):startGame(1)}else{ls.s('tlp','0');seq(END,()=>{S='end'})}}
function reset(){t=0;pl={x:R.s[0],y:R.s[1],w:18,h:34,vx:0,vy:0,g:0,f:1,st:0,coy:0,buf:0};rec=[];
 R.sw.forEach(s=>s.on=0);R.d.forEach(d=>{d.L=0;d.o=undefined});R.pl.forEach(q=>{q.on=0;q.w2=0});place();calc()}
function place(){echoes.forEach(E=>{const f=E.f[Math.min(t,E.f.length-1)];E.fr=f;E.r={x:f[0],y:f[1],w:18,h:34,f:f[2],st:f[3]}})}
function calc(){act={};const en=[pl].concat(echoes.map(E=>E.r));
 R.pl.forEach(q=>{q.on=en.some(u=>ov(u,[q.x,q.y-8,q.w,10]));if(q.on){act[q.id]=1;if(!q.w2)snd(560,.12,'triangle',.06)}q.w2=q.on});
 R.sw.forEach(s=>{if(s.on)act[s.id]=1});
 R.d.forEach(d=>{const a=d.ids.every(i=>act[i]);if(a)d.L=1;const o=d.l?!!d.L:a;if(d.o!==undefined&&o!==d.o)snd(o?440:230,.18,'triangle',.05);d.o=o})}
function inter(x,y,live){R.sw.forEach(s=>{if(Math.abs(x+9-(s.x+12))<46&&Math.abs(y-s.y)<50){if(!s.on){s.on=1;snd(420,.15,'square',.04,260)}if(live&&s.t)toast(s.t)}})}
function die(){shake=9;flash=.35;snd(130,.35,'sawtooth',.07,-90);reset()}
function keep(){if(R.cap&&rec.length>25){echoes.push({f:rec.slice()});if(echoes.length>R.cap)echoes.shift();snd(520,.3,'sine',.06,-300)}else snd(200,.1,'triangle');reset()}
function tick(){
 if(P.KeyR){keep();return}
 if(P.KeyC){echoes=[];snd(160,.2,'triangle',.06,-60);reset();return}
 place();echoes.forEach(E=>{if(t<E.f.length&&E.fr[4])inter(E.r.x,E.r.y,0)});
 R.mv.forEach(m=>{const o=at(m,Math.max(0,t-1)),n=at(m,t);if(pl.g&&Math.abs(pl.y+pl.h-o[1])<2.5&&pl.x+pl.w>o[0]&&pl.x<o[0]+o[2]){pl.x+=n[0]-o[0];pl.y+=n[1]-o[1]}});
 const lf=K.ArrowLeft||K.KeyA,rg=K.ArrowRight||K.KeyD,jp=P.Space||P.KeyW||P.ArrowUp,jh=K.Space||K.KeyW||K.ArrowUp;
 const tv=((rg?1:0)-(lf?1:0))*230;pl.vx+=(tv-pl.vx)*(pl.g?.4:.2);if(tv)pl.f=tv>0?1:-1;
 pl.coy=pl.g?6:pl.coy-1;pl.buf=jp?6:pl.buf-1;
 if(pl.buf>0&&pl.coy>0){pl.vy=-640;pl.buf=0;pl.coy=0;pl.g=0;snd(300,.12,'square',.03,220)}
 if(!jh&&pl.vy<-220)pl.vy*=.6;
 pl.vy=Math.min(900,pl.vy+1900*DT);
 mv(pl,pl.vx*DT,pl.vy*DT,sol(t));
 pl.x=Math.max(0,Math.min(W-pl.w,pl.x));pl.st=!pl.g?2:Math.abs(pl.vx)>25?1:0;
 if(P.KeyE)inter(pl.x,pl.y,1);
 if(R.lz.some(z=>ov(pl,at(z,t)))||R.sp.some(s=>ov(pl,[s[0]+2,s[1]-12,s[2]-4,12]))||pl.y>620)return die();
 if(rec.length<5400)rec.push([pl.x,pl.y,pl.f,pl.st,P.KeyE?1:0]);
 calc();t++;
 if(ov(pl,[R.x[0],R.x[1],24,44])){snd(660,.4,'sine',.07,300);go(()=>{if(ri+1<LV[lvl].length)loadRoom(lvl,ri+1);else endLevel()})}
}
function upd(d){
 if(S==='title'){if(P.Enter||P.Space){startGame(+ls.g('tlp')||0)}if(P.Backspace)ls.s('tlp','0')}
 else if(S==='card'){card.t+=d;if(card.t>.7&&(P.Enter||P.Space)){snd(400,.08);card.cb()}}
 else if(S==='pause'){if(P.Escape||P.Enter){S='play'}if(P.KeyX){echoes=[];reset();S='play'}}
 else if(S==='fade'){fd+=d;if(fd>.4){const f=fcb;S='play';fi=.4;f()}}
 else if(S==='end'){if(P.Enter||P.Space)startGame(0);if(P.Backspace){ls.s('tlp','0');S='title'}}
}
let last=0,acc=0;
function frame(ts){requestAnimationFrame(frame);const d=Math.min(.1,(ts-last)/1000||0);last=ts;T+=d;
 if(P.KeyM){muted=!muted;ls.s('tlp_m',muted?'1':'0');if(M)M.gain.value=muted?0:1;delete P.KeyM}
 if(fi>0)fi-=d;shake*=.88;flash=Math.max(0,flash-d);if(toastT>0)toastT-=d;
 if(S==='play'){if(P.Escape){S='pause';delete P.Escape}else{age+=d;acc+=d;while(acc>=DT&&S==='play'){tick();acc-=DT;for(const k in P)delete P[k]}}}
 else{upd(d);for(const k in P)delete P[k];acc=0}
 draw()}
requestAnimationFrame(frame);

/* ---------- rendering ---------- */
function txt(s,x,y,sz,col,al,fam){X.font=(sz||14)+'px '+(fam||'"Courier New",monospace');X.fillStyle=col||'#cfe8ff';X.textAlign=al||'center';X.fillText(s,x,y)}
function wrap(s,w){const o=[];let l='';for(const wd of s.split(' ')){const n=l?l+' '+wd:wd;if(X.measureText(n).width>w&&l){o.push(l);l=wd}else l=n}o.push(l);return o}
function gear(x,y,r,a){X.strokeStyle='#1a2151';X.lineWidth=6;X.beginPath();X.arc(x,y,r,0,7);X.stroke();X.lineWidth=3;for(let i=0;i<10;i++){const b=a+i*.628;X.beginPath();X.moveTo(x+Math.cos(b)*r,y+Math.sin(b)*r);X.lineTo(x+Math.cos(b)*(r+12),y+Math.sin(b)*(r+12));X.stroke()}X.beginPath();X.moveTo(x,y);X.lineTo(x+Math.cos(a)*r,y+Math.sin(a)*r);X.stroke()}
function fig(x,y,f,st,col,a,vc){X.save();X.globalAlpha=a;X.translate(x+9,y);X.scale(f,1);X.fillStyle=col;const l=st===1?Math.round(Math.sin(T*16)*2):0,u=st===2?3:0;
 X.fillRect(-6,0,12,10);X.fillRect(-7,10,14,14);X.fillRect(-6,24,5,8-u+l);X.fillRect(1,24,5,8-u-l);X.fillStyle=vc;X.fillRect(1,3,5,3);X.restore()}
function archive(){const lit=ri===2&&R.d.some(d=>d.o);for(let r=0;r<3;r++)for(let c=0;c<14;c++){const a=.07+.05*Math.sin(T*1.3+c*.7+r);fig(40+c*66,110+r*110,1,0,lit?'#ffb347':'#7a6ab0',lit?a*3.2:a,lit?'#ffb347':'#7a6ab0')}}
function bg(){const g=X.createLinearGradient(0,0,0,H);g.addColorStop(0,'#04050e');g.addColorStop(1,'#12163f');X.fillStyle=g;X.fillRect(0,0,W,H);
 X.fillStyle='#0a0e2a';for(let i=0;i<8;i++){const h=160+(i*71%150);X.fillRect(i*130+20,H-h,70,h)}
 gear(150,140,64,T*.3);gear(790,110,90,-T*.2);gear(520,60,40,T*.5);
 if(R&&lvl===2&&S!=='title'&&S!=='card')archive();
 for(let i=0;i<3;i++){const x=(i*400+T*12)%1200-120,r=X.createRadialGradient(x,430,0,x,430,260);r.addColorStop(0,'rgba(90,70,150,.16)');r.addColorStop(1,'rgba(90,70,150,0)');X.fillStyle=r;X.fillRect(x-260,170,520,360)}}
function fg(){X.fillStyle='rgba(95,243,255,.3)';for(const q of dust){q.y-=q.v;q.x+=Math.sin(T+q.v*9)*.25;if(q.y<0){q.y=H;q.x=Math.random()*W}X.fillRect(q.x,q.y,2,2)}
 const v=X.createRadialGradient(W/2,H/2,250,W/2,H/2,620);v.addColorStop(0,'rgba(0,0,0,0)');v.addColorStop(1,'rgba(0,0,5,.65)');X.fillStyle=v;X.fillRect(0,0,W,H);
 if(Math.sin(T*23)*Math.sin(T*7.3)>.96){X.fillStyle='rgba(0,0,10,.18)';X.fillRect(0,0,W,H)}}
function slab(s,c){X.fillStyle='#121842';X.fillRect(s[0],s[1],s[2],s[3]);X.fillStyle=c;X.fillRect(s[0],s[1],s[2],2);X.fillStyle='rgba(120,140,255,.07)';for(let i=s[0]+8;i<s[0]+s[2];i+=16)X.fillRect(i,s[1]+2,1,s[3]-2)}
function world(){X.save();if(shake>.3)X.translate((Math.random()-.5)*shake,(Math.random()-.5)*shake);
 R.p.forEach(s=>slab(s,'#3a4c9a'));R.mv.forEach(m=>slab(at(m,t),'#5ff3ff'));
 R.pl.forEach(q=>{X.fillStyle='#0c1030';X.fillRect(q.x-4,q.y-3,q.w+8,3);X.fillStyle=q.on?'#5ff3ff':'#6b57a8';X.fillRect(q.x,q.y-(q.on?3:6),q.w,q.on?3:6);if(q.on){X.fillStyle='rgba(95,243,255,.16)';X.fillRect(q.x-6,q.y-34,q.w+12,34)}txt(q.id,q.x+q.w/2,q.y-14,13,q.on?'#5ff3ff':'#8f7fd0')});
 R.d.forEach(d=>{const lb=d.ids.join('+').toUpperCase();
  if(d.b){if(d.o){X.fillStyle='rgba(95,243,255,.85)';X.fillRect(d.x,d.y,d.w,d.h);X.fillStyle='rgba(95,243,255,.15)';X.fillRect(d.x,d.y+d.h,d.w,10)}else{X.strokeStyle='rgba(95,243,255,.28)';X.setLineDash([6,8]);X.strokeRect(d.x+.5,d.y+.5,d.w,d.h);X.setLineDash([])}txt(lb,d.x+d.w/2,d.y+d.h+26,13,'#5ff3ff')}
  else{if(!d.o){X.fillStyle='#1a2352';X.fillRect(d.x,d.y,d.w,d.h);X.fillStyle='rgba(95,243,255,'+(.5+.3*Math.sin(T*4))+')';for(let y=d.y;y<d.y+d.h;y+=24)X.fillRect(d.x,y,d.w,3)}else{X.fillStyle='rgba(95,243,255,.12)';X.fillRect(d.x+d.w/2-1,d.y,2,d.h)}txt(lb,d.x+d.w/2,d.y+d.h-70,13,d.o?'#5ff3ff':'#cfe8ff')}});
 R.sw.forEach(s=>{X.fillStyle='#0d1233';X.fillRect(s.x,s.y,24,34);X.fillStyle=s.on?'rgba(255,179,71,.35)':'#ffb347';X.fillRect(s.x+4,s.y+5,16,12);X.fillStyle='#2a3470';X.fillRect(s.x+4,s.y+20,16,3);
  if(Math.abs(pl.x+9-(s.x+12))<46&&Math.abs(pl.y-s.y)<50)txt('[E]',s.x+12,s.y-8,13,'#ffb347');else txt(s.id.toUpperCase(),s.x+12,s.y-8,12,'#8f7fd0')});
 R.sp.forEach(s=>{X.fillStyle='#ff506e';for(let x=s[0];x<s[0]+s[2];x+=12){X.beginPath();X.moveTo(x,s[1]);X.lineTo(x+6,s[1]-12);X.lineTo(x+12,s[1]);X.fill()}});
 R.lz.forEach(z=>{const a=at(z,t);X.fillStyle='rgba(255,80,110,.25)';X.fillRect(a[0]-4,a[1]-4,a[2]+8,a[3]+8);X.fillStyle='#ff506e';X.fillRect(a[0],a[1],a[2],a[3])});
 const e=R.x,fin=lvl===2&&ri===2;X.fillStyle='#0a0e2a';X.fillRect(e[0]-4,e[1]-4,32,52);X.globalAlpha=.5+.3*Math.sin(T*3);X.fillStyle=fin?'#ffb347':'#5ff3ff';X.fillRect(e[0],e[1],24,44);X.globalAlpha=1;
 echoes.forEach((E,i)=>{const j=Math.sin(T*9+i*2)>.93?3:0,r=E.r;fig(r.x-2,r.y,r.f,r.st,'#8a6bd6',.2,'#8a6bd6');fig(r.x+j,r.y,r.f,r.st,'#5ff3ff',.45,'#e6ffff');X.fillStyle='rgba(95,243,255,.12)';for(let y=r.y;y<r.y+34;y+=4)X.fillRect(r.x-6+(((y+T*30)|0)%3),y,26,1);txt('E'+(i+1),r.x+9,r.y-6,11,'#5ff3ff')});
 const gl=X.createRadialGradient(pl.x+9,pl.y+17,2,pl.x+9,pl.y+17,48);gl.addColorStop(0,'rgba(255,179,71,.12)');gl.addColorStop(1,'rgba(255,179,71,0)');X.fillStyle=gl;X.fillRect(pl.x-40,pl.y-30,98,100);
